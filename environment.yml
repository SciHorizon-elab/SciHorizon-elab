# 本地包安装说明
# 以上 rrt-algorithms / scihorizon-elab / vlabench 三行已注释：它们不在 PyPI 上，
# pip 无法直接安装，需要在仓库中手动以 editable 方式安装：
#
#   # 1. 本仓库（scihorizon-elab）+ 本地 rrt-algorithms，在本仓库根目录执行：
#   pip install -e src/rrt-algorithms
#   pip install -e .
#
#   # 2. vlabench 来自另一个仓库 SciVLABench，需另行克隆后安装：
#   git clone git@github.com:kaikai-2022/SciVLABench.git
#   cd SciVLABench && pip install -e .
# ============================================================================
